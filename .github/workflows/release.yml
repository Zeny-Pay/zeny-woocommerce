name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin zip
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the plugin version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          version="$(sed -n 's/^ \* Version: *//p' zeny-woocommerce.php)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != plugin version $version"; exit 1; }

      - run: bin/build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" "build/zeny-woocommerce-$version.zip" \
            --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
